[package]
name = "ruuvi2mqtt-checker"
version = "0.0.0"
authors = ["Teemu Matilainen <teemu.matilainen@iki.fi>"]
license = "MIT"
repository = "https://github.com/tmatilai/ruuvi2mqtt"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive", "wrap_help"] }
rumqttc = "=0.25.1"
serde_json = "=1.0.153"
tokio = { version = "=1.53.2", features = ["macros", "rt", "time"] }
