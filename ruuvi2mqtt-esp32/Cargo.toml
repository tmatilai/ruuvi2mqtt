[package]
name = "ruuvi2mqtt-esp32"
version = "1.7.1-dev"
authors = ["Teemu Matilainen <teemu.matilainen@iki.fi>"]
license = "MIT"
repository = "https://github.com/tmatilai/ruuvi2mqtt"
edition = "2021"
rust-version = "1.85"

[[bin]]
name = "ruuvi2mqtt-esp32"
harness = false # required: ESP-IDF entry point is not compatible with the test harness
test = false # needs ESP-IDF; the host tests are in the lib

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"

[dependencies]
anyhow = "=1.0.104"
ruuvi-sensor-protocol = "=0.7.0"
log = "=0.4.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
konst = "=0.4.3"

# Only on the ESP32, so the lib's pure-Rust modules build and test on the host.
[target.'cfg(target_os = "espidf")'.dependencies]
esp-idf-svc = "=0.53.0"
esp32-nimble = "=0.13.0"

[build-dependencies]
embuild = { version = "=0.33.7", features = ["espidf"] }

# ESP-IDF 6.0 moved the MQTT client out of the core into a managed component.
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mqtt", version = "1.*" }
# For the status page's <hostname>.local
[[package.metadata.esp-idf-sys.extra_components]]
remote_component = { name = "espressif/mdns", version = "1.*" }
