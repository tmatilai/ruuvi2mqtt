[toolchain]
# RISC-V targets (ESP32-C6, ESP32-C3) need nightly for build-std support.
# Xtensa targets (ESP32, ESP32-S3) require the Espressif fork: cargo +esp
# Install with: cargo install espup && espup install
# Pinned: a new nightly can break the build. Renovate bumps it.
channel = "nightly-2026-10-12"
profile = "minimal"
components = ["rust-src", "clippy", "rustfmt"]
