[package]
name = "ruuvi2mqtt"
version = "1.4.1-dev"
authors = ["Teemu Matilainen <teemu.matilainen@iki.fi>"]
license = "MIT"
repository = "https://github.com/tmatilai/ruuvi2mqtt"
edition = "2024"

[features]
default = ["vendored"]
vendored = ["dbus/vendored"]

[profile.release]
lto = true
strip = true

[dependencies]
anyhow = "1.0.104"
btleplug = "0.12.0"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
derive_more = { version = "2.1.1", features = ["debug"] }
env_logger = "0.11.11"
futures = "0.3.34"
log = "0.4.34"
rand = "0.10.2"
rumqttc = "0.25.1"
rustls-native-certs = "0.8.4"
ruuvi-sensor-protocol = "0.6.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_with = "3.22.0"
serde_norway = "0.9.42"
sysinfo = "0.39.6"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(target_os = "linux")'.dependencies]
dbus = { version = "0.9.12", optional = true }

[dev-dependencies]
trycmd = "1.2.1"
