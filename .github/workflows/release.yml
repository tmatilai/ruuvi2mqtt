name: Release

# A release commit sets the crate version to one without the -dev suffix.
# Merging it to main tags, builds and publishes the release, and opens the
# PR for the next dev cycle. A manual dispatch builds a debug image tagged
# after the branch.
on:
  push:
    branches: ["main"]
  workflow_dispatch: {}

permissions: {}

concurrency: release

jobs:
  check:
    name: Check for a release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for an unreleased version
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          script/check-version
          version="$(awk -F'"' '/^version = / { print $2; exit }' Cargo.toml)"
          if [[ "$version" == *-dev ]]; then
              echo "Development version $version, nothing to release"
          elif gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" --silent 2>/dev/null; then
              echo "Tag v$version already exists"
          else
              echo "version=$version" >> "$GITHUB_OUTPUT"
          fi

  build:
    name: Build binaries
    needs: check
    if: needs.check.outputs.version || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
        os: [ubuntu-latest]
    env:
      RELEASE: ${{ needs.check.outputs.version != '' }}
      PROFILE: ${{ needs.check.outputs.version && 'release' || 'debug' }}
      MUSL: ${{ contains(matrix.target, '-unknown-linux-musl') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - name: Setup | Cross
        run: |
          cargo install --bins cross@0.2.5

      - name: Setup | Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          if [[ "$RELEASE" == 'true' ]]; then set -- --release; fi
          cross build --verbose "$@" --target ${{ matrix.target }}

      - name: Prepare artifact
        run: |
          mkdir -p 'binaries/${{ matrix.target }}'
          cp target/${{ matrix.target }}/"$PROFILE"/ruuvi2mqtt binaries/${{ matrix.target }}/

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-${{ matrix.target }}
          path: binaries
          if-no-files-found: error
          compression-level: 3

  docker:
    name: Build and push Docker images
    needs: [check, build]
    # Requires manual approval before anything is published
    environment: release
    permissions:
      contents: read
      packages: write
    env:
      PLATFORMS: linux/amd64,linux/arm64,linux/arm/v7
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true

      - name: Setup | Prepare binaries
        run: |
          chmod 0755 binaries/*/ruuvi2mqtt
          mkdir -p binaries/{${{ env.PLATFORMS }}}
          ln -s ../../aarch64-unknown-linux-musl/ruuvi2mqtt binaries/linux/arm64/
          ln -s ../../../armv7-unknown-linux-musleabihf/ruuvi2mqtt binaries/linux/arm/v7/
          ln -s ../../x86_64-unknown-linux-musl/ruuvi2mqtt binaries/linux/amd64/

      - name: Setup | Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup | Docker QEMU
        uses: docker/setup-qemu-action@1f40c72289eff860ee54a304f1438e3cff362e0a # v4.3.0

      - name: Setup | Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ needs.check.outputs.version }},enable=${{ needs.check.outputs.version != '' }}
            type=raw,value=latest,enable=${{ needs.check.outputs.version != '' }}
            type=ref,event=branch,enable=${{ needs.check.outputs.version == '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  gh-release:
    name: Make a GitHub release
    needs: [check, docker]
    if: needs.check.outputs.version
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Download artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: binaries-*
          path: binaries
          merge-multiple: true

      - name: Create tarballs
        run: |
          mkdir -p tarballs
          for target in binaries/*; do
            tar -czf tarballs/$(basename $target).tar.gz -C $target .
          done

      - name: Create the tag and the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$(awk -v heading="## $VERSION /" '
              index($0, heading) == 1 { found = 1; next }
              /^## / { found = 0 }
              found
          ' CHANGELOG.md)"
          if ! grep -q '[^[:space:]]' <<< "$notes"; then
              echo "No changelog entry for $VERSION" >&2
              exit 1
          fi
          gh release create "v$VERSION" --title "v$VERSION" --notes "$notes" --target "$GITHUB_SHA" tarballs/*

  bump:
    name: Start the next dev cycle
    needs: [check, gh-release]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The app token makes CI run on the PR; GITHUB_TOKEN does not trigger workflows
      - name: Generate token
        id: generate-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      # Committed through the API so that GitHub signs it, and as a PR
      # because main requires the status checks
      - name: Open the pull request
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
        run: |
          next="$(awk -F. '{ print $1 "." $2 "." $3 + 1 }' <<< "$VERSION")"
          script/bump "$next"
          branch='next-dev-cycle'
          gh api "repos/$GITHUB_REPOSITORY/git/refs" --silent -f ref="refs/heads/$branch" -f sha="$GITHUB_SHA"
          jq -n \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg branch "$branch" \
            --arg oid "$GITHUB_SHA" \
            --rawfile changelog CHANGELOG.md \
            --rawfile toml Cargo.toml \
            --rawfile lock Cargo.lock \
            --rawfile esp32_toml ruuvi2mqtt-esp32/Cargo.toml \
            --rawfile esp32_lock ruuvi2mqtt-esp32/Cargo.lock \
            '{
              query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: "Start the next dev cycle"},
                fileChanges: {additions: [
                  {path: "CHANGELOG.md", contents: ($changelog | @base64)},
                  {path: "Cargo.toml", contents: ($toml | @base64)},
                  {path: "Cargo.lock", contents: ($lock | @base64)},
                  {path: "ruuvi2mqtt-esp32/Cargo.toml", contents: ($esp32_toml | @base64)},
                  {path: "ruuvi2mqtt-esp32/Cargo.lock", contents: ($esp32_lock | @base64)}
                ]}
              }}
            }' > commit.json
          gh api graphql --silent --input commit.json
          gh pr create --base main --head "$branch" \
            --title "Start the next dev cycle" \
            --body "Bump to $next-dev after releasing v$VERSION."
          gh pr merge --auto --squash "$branch"
