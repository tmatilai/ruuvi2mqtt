name: CI

on:
  push:
    branches: ["main"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rustfmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: rustfmt

      - name: Run fmt
        run: cargo fmt --all -- --check

      - name: Run fmt (esp32)
        run: cargo fmt --manifest-path ruuvi2mqtt-esp32/Cargo.toml -- --check

      - name: Check the version
        run: script/check-version

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy
        run: cargo clippy --locked --workspace --tests --all-targets --all-features -- -D clippy::all -W clippy::pedantic

  clippy-esp32:
    name: Clippy (ESP32-C6)
    runs-on: ubuntu-latest
    env:
      WIFI_SSID: dummy
      WIFI_PASS: dummy
      MQTT_SERVER: dummy
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        run: cd ruuvi2mqtt-esp32 && rustup toolchain install

      - name: Setup | ldproxy
        run: cargo install --locked ldproxy@0.3.5

      - name: Setup | ESP-IDF version
        id: esp-idf
        run: echo "version=$(grep -oP 'ESP_IDF_VERSION\s*=\s*"\K[^"]+' ruuvi2mqtt-esp32/.cargo/config.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ruuvi2mqtt-esp32 -> target
          cache-directories: ~/.espressif
          shared-key: esp32c6-riscv-${{ steps.esp-idf.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy (ESP32-C6)
        run: cd ruuvi2mqtt-esp32 && cargo clippy --locked -- -D clippy::all -W clippy::pedantic

  test-esp32:
    name: Test (ESP32)
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable
          components: clippy

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ruuvi2mqtt-esp32 -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run clippy (host tests)
        run: cd ruuvi2mqtt-esp32 && cargo +stable clippy --locked --target host-tuple --lib --tests -- -D clippy::all -W clippy::pedantic

      - name: Run tests
        run: make -C ruuvi2mqtt-esp32 test

  build-esp32:
    name: Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ESP32-C6
            chip: esp32c6
            target: riscv32imac-esp-espidf
            cache-key: esp32c6-riscv
          # The Xtensa chips build with Espressif's Rust fork, which lags
          # upstream. They also compile esp32-nimble's code for the older
          # Bluetooth controller, which ESP32-C6 doesn't use.
          - name: ESP32-S3
            chip: esp32s3
            target: xtensa-esp32s3-espidf
            cache-key: esp32s3-xtensa
            xtensa: true
    env:
      MCU: ${{ matrix.chip }}
      TARGET: ${{ matrix.target }}
      WIFI_SSID: dummy
      WIFI_PASS: dummy
      MQTT_SERVER: dummy
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        if: ${{ !matrix.xtensa }}
        run: cd ruuvi2mqtt-esp32 && rustup toolchain install

      - name: Setup | Rust (Xtensa)
        if: ${{ matrix.xtensa }}
        run: |
          # The prebuilt espup saves compiling it. The Makefile pins its version.
          espup_version=$(grep -oP '^ESPUP_VERSION\s*:=\s*\K\S+' ruuvi2mqtt-esp32/Makefile)
          curl -fsSL -o ~/.cargo/bin/espup \
            "https://github.com/esp-rs/espup/releases/download/v${espup_version}/espup-x86_64-unknown-linux-gnu"
          chmod +x ~/.cargo/bin/espup
          version=$(grep -oP '^XTENSA_TOOLCHAIN_VERSION\s*:=\s*\K\S+' ruuvi2mqtt-esp32/Makefile)
          # Skipping the version parse avoids GitHub API calls and their rate limit.
          # --std leaves GCC to esp-idf-sys.
          espup install --std --targets "$MCU" --toolchain-version "$version" --skip-version-parse
          # RUSTUP_TOOLCHAIN also puts the toolchain version in the cache key.
          echo "RUSTUP_TOOLCHAIN=esp" >> "$GITHUB_ENV"
          # bindgen needs Espressif's libclang for Xtensa.
          echo "LIBCLANG_PATH=$(grep -oP '^export LIBCLANG_PATH="\K[^"]+' ~/export-esp.sh)" >> "$GITHUB_ENV"

      - name: Setup | ldproxy
        run: cargo install --locked ldproxy@0.3.5

      - name: Setup | ESP-IDF version
        id: esp-idf
        run: echo "version=$(grep -oP 'ESP_IDF_VERSION\s*=\s*"\K[^"]+' ruuvi2mqtt-esp32/.cargo/config.toml)" >> "$GITHUB_OUTPUT"

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ruuvi2mqtt-esp32 -> target
          cache-directories: ~/.espressif
          shared-key: ${{ matrix.cache-key }}-${{ steps.esp-idf.outputs.version }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build firmware
        run: cd ruuvi2mqtt-esp32 && cargo build --release --locked --target "$TARGET"

  test-checker:
    name: Test (checker)
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run tests
        run: cargo test --locked -p ruuvi2mqtt-checker

  test:
    name: Test
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - aarch64-unknown-linux-gnu
          - aarch64-unknown-linux-musl
          - armv7-unknown-linux-gnueabihf
          - armv7-unknown-linux-musleabihf
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
        os: [ubuntu-latest]
    env:
      USE_CROSS: "${{ !startsWith(matrix.target, 'x86_64-unknown-linux-') }}"
      MUSL: ${{ contains(matrix.target, '-unknown-linux-musl') }}
      CARGO: cargo
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup | Rust
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0
        with:
          toolchain: stable

      - name: Setup | Cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: ${{ matrix.target }}-${{ matrix.os }}-debug-build
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup | Cross
        if: env.USE_CROSS == 'true'
        run: |
          cargo install --locked --bins cross@0.2.5
          echo "CARGO=cross" >> "$GITHUB_ENV"

      - name: Setup | Install build dependencies
        if: env.USE_CROSS == 'false'
        run: |
          rustup target add ${{ matrix.target }}
          if [[ "$MUSL" == 'true' ]]; then
            sudo apt-get update
            sudo apt-get install --assume-yes musl-tools
          fi

      - name: Setup | Log in to the Container registry
        if: env.USE_CROSS == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run check
        run: $CARGO check --target ${{ matrix.target }}

      - name: Run tests
        run: $CARGO test --verbose --target ${{ matrix.target }} --bin ruuvi2mqtt

      - name: Run CLI tests
        # trycmd doesn't support cross runners yet:
        # https://github.com/assert-rs/snapbox/issues/51
        if: env.USE_CROSS == 'false'
        run: $CARGO test --verbose --target ${{ matrix.target }} --test cli_tests

  zizmor:
    name: Zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Setup | Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false
